name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}   # biar bisa di-trigger manual dari tab Actions di GitHub

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'   # tidak di-pin ke versi lama biar selalu cocok sama Dart SDK yang diminta pubspec.yaml
          cache: true

      - name: Ambil dependencies
        run: flutter pub get

      - name: Analisis kode (opsional, tidak menggagalkan build kalau ada warning)
        run: flutter analyze || true

      - name: Build APK release
        run: flutter build apk --release

      - name: Upload APK sebagai artifact
        uses: actions/upload-artifact@v4
        with:
          name: anikuplay-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
